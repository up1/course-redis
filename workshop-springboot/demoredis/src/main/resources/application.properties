spring.application.name=demoredis
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demodb}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}
# HikariCP connection pool (default pool of Spring Boot)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:20}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
# Client side timeouts (Spring / Lettuce)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s
# Lettuce connection pool (needs commons-pool2)
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX:20}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX:20}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}
spring.data.redis.lettuce.pool.max-wait=500ms

# ---- Application ----
# TTL of a cached user in Redis
app.cache.user-ttl=10m
app.cache.key-prefix=user:
# number of users generated into PostgreSQL on first start (0 = disable)
app.seed.users=1000000
