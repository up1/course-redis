spring.application.name=demoredis
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demodb}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
# Client side timeouts (Spring / Lettuce)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

# ---- Application ----
# TTL of a cached user in Redis
app.cache.user-ttl=10m
app.cache.key-prefix=user:
# number of users generated into PostgreSQL on first start (0 = disable)
app.seed.users=1000000
