bind 0.0.0.0
port 6379
protected-mode no

# Close a client connection after N seconds of idle (0 = disabled)
timeout 300
# TCP keepalive probe every N seconds
tcp-keepalive 60

# Cache behaviour: bounded memory, evict least-recently-used keys
maxmemory 1gb
maxmemory-policy allkeys-lru

# Cache only: no persistence
save ""
appendonly no
