# Redis Search & Query workshop (shell + redis-cli only)
# Redis 8+ ships the Query Engine (FT.* commands) built in - no Redis Stack needed.
services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.12}
    container_name: workshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./seed:/seed:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
